name: release

# Push a tag like `v0.1.0` and the VSIX lands on the Releases page, where anybody can
# download it and run `code --install-extension`. No marketplace account is involved.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check-core
      - run: npm run typecheck
      - run: npm test
      - run: npm run package
      - name: Check the tag matches the manifest version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(printf 'Install:\n\n    gh release download %s --repo %s --pattern antigravity-chat.vsix\n    code --install-extension antigravity-chat.vsix\n\nOr download antigravity-chat.vsix with a browser and use VS Code -> Extensions -> ... -> Install from VSIX...\n\nThen: Chat -> model picker -> Manage Models -> Antigravity.\n' "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY")
          gh release create "$GITHUB_REF_NAME" antigravity-chat.vsix \
            --title "VS Code extension ${GITHUB_REF_NAME#v}" \
            --notes "$notes"
